[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-ayinbox"
dynamic = ["version"]
description = "LangChain tools for AY Inbox, built from the API's agent tool catalogue"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "AY Inbox", email = "team@ayinbox.com" }]
keywords = ["ayinbox", "langchain", "agents", "tools", "cold email"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["langchain-core>=1.0.0,<2", "httpx>=0.27,<1"]

[project.urls]
Homepage = "https://ayinbox.com"
Documentation = "https://docs.ayinbox.com/api/agent-tools/"
Source = "https://github.com/ayinbox/langchain-ayinbox"
Changelog = "https://github.com/ayinbox/langchain-ayinbox/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "langchain-tests>=1.0.0,<2",
    "langchain>=1.0.0,<2",
    "mypy==2.4.1",
    "ruff==0.17.5",
]

[tool.hatch.version]
path = "langchain_ayinbox/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["langchain_ayinbox"]

[tool.hatch.build.targets.sdist]
include = ["langchain_ayinbox", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["langchain_ayinbox", "tests", "examples"]

[[tool.mypy.overrides]]
module = ["langchain_tests.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
